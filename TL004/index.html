<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f6e2da" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="蛇貂大反擊" />
    <meta name="description" content="TailLabs TL004:拉開彈弓,把蛇貂射向複製魔法塔。手感原型。" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>蛇貂大反擊 · TailLabs TL004</title>
  </head>
  <body>
    <div id="stage">
      <div id="game"></div>

      <div id="hud" hidden>
        <ol id="queue" class="queue" aria-label="剩餘蛇貂"></ol>
        <div class="hud-right">
          <div class="score-card"><span>分數</span><strong id="score">0</strong></div>
          <button id="sound-button" class="icon-button" type="button" aria-label="關閉音效" aria-pressed="false">♪</button>
          <button id="restart-button" class="icon-button" type="button" aria-label="重新開始">↻</button>
        </div>
        <button id="next-button" class="next-button" type="button" hidden>下一隻 <span aria-hidden="true">›</span></button>
      </div>

      <section id="start-panel" class="panel start-panel" aria-labelledby="start-title">
        <p class="eyebrow">TAIL LABS · TL004 · 手感原型</p>
        <h1 id="start-title">蛇貂大反擊</h1>
        <p class="lead">拉開彈弓,打碎塔裡的複製水晶。</p>
        <button id="start-button" class="primary-button" type="button">開始 <span aria-hidden="true">→</span></button>
        <p id="install-hint" class="hint" hidden></p>
      </section>

      <section id="result-panel" class="panel result-panel" aria-labelledby="result-title" hidden>
        <h2 id="result-title">過關!</h2>
        <div class="stars" aria-hidden="true"><span>★</span><span>★</span><span>★</span></div>
        <p id="result-stars-label" class="sr-only"></p>
        <p class="result-score"><span>分數</span><strong id="result-score">0</strong></p>
        <button id="retry-button" class="primary-button" type="button">再玩一次 <span aria-hidden="true">↻</span></button>
      </section>

      <div id="rotate-panel" class="rotate-panel" role="alert">
        <div class="rotate-phone" aria-hidden="true"></div>
        <p>請把手機轉成橫向</p>
      </div>
    </div>
    <noscript>請啟用 JavaScript 以開始遊戲。</noscript>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
